<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Mumbai Road Rage</title><style>*{box-sizing:border-box}body{margin:0;background:#081a2b;color:white;font:700 16px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#hud{position:absolute;top:12px;left:15px;right:15px;display:flex;justify-content:space-between;text-shadow:0 2px 5px black}#overlay{position:absolute;inset:0;background:#071827e9;display:grid;place-items:center;text-align:center;padding:24px}#overlay section{max-width:520px}h1{font-size:clamp(40px,9vw,76px);line-height:1;color:#ffd04b}button{background:#ffd04b;color:#122438;border:0;border-radius:13px;padding:14px 22px;font-weight:900;font-size:18px;touch-action:none}#touch{position:absolute;bottom:22px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}#touch div{display:flex;gap:8px}#touch button{pointer-events:auto;opacity:.85}small{color:#b7c9d7}</style><canvas id="c"></canvas><div id="hud"><div>🏍️ <span id="speed">0</span> KM/H<br>❤️ <span id="hp">100</span></div><div>MARINE DRIVE · MUMBAI<br>🏁 <span id="dist">0</span>/3000 M · ⭐ <span id="score">0</span></div></div><div id="touch"><div><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button></div><div><button data-k="Space">👊</button><button data-k="ArrowDown">▼</button><button data-k="ArrowUp">▲</button></div></div><div id="overlay"><section><h1>MUMBAI<br>ROAD RAGE</h1><h2>MARINE DRIVE MAYHEM</h2><p>Dodge kaali-peeli taxis and BEST buses. Race rival bikers through the Queen's Necklace.</p><p>WASD / arrows to drive · SPACE to punch</p><button id="start">START RACE 🏁</button><p><small>Built with curiosity · Original arcade game</small></p></section></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),keys={},ui=id=>document.getElementById(id);let W,H,last=0,run=false,speed=0,dist=0,hp=100,score=0,x=0,spawn=0,cars=[],punch=0,damage=0;function size(){W=c.width=innerWidth;H=c.height=innerHeight}onresize=size;size();onkeydown=e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()};onkeyup=e=>keys[e.code]=false;document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{keys[k]=true;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>keys[k]=false});function reset(){speed=dist=score=x=spawn=punch=damage=0;hp=100;cars=[];run=true;ui('overlay').style.display='none';last=performance.now();requestAnimationFrame(loop)}ui('start').onclick=reset;function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function poly(points,color){g.fillStyle=color;g.beginPath();points.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fill()}function project(z,lane){let t=1/(1+z*.003),y=H*.42+(H*.62)*t,half=W*(.018+.43*t);return {x:W/2+lane*half,y,t,half}}function draw(){let h=H*.42,sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#092341');sky.addColorStop(1,'#f9a47b');rect(0,0,W,h,sky);g.fillStyle='#ffd98d';g.beginPath();g.arc(W*.72,h*.6,Math.min(W,H)*.07,0,7);g.fill();rect(0,h,W,H-h,'#15516b');for(let i=0;i<25;i++){let bx=(i*79-dist*.3)%(W*.53);if(bx<0)bx+=W*.53;let bh=35+i*17%85;rect(bx,h-bh,45,bh,i%2?'#263c54':'#34465a');for(let j=0;j<3;j++)rect(bx+8+j*12,h-bh+12,4,5,'#f7c783')}poly([[W*.48,h],[W*.52,h],[W,H],[0,H]],'#303a44');poly([[W*.486,h],[W*.514,h],[W*.94,H],[W*.06,H]],'#484e58');for(let i=0;i<22;i++){let z=((i*155-dist*3)%3410+3410)%3410,p=project(z,0);if(z<2800){rect(p.x-p.half*.32,p.y,3+7*p.t,18+60*p.t,'#f9e9bb');rect(p.x+p.half*.32,p.y,3+7*p.t,18+60*p.t,'#f9e9bb')}}cars.sort((a,b)=>b.z-a.z).forEach(o=>{if(o.z<0||o.z>2800)return;let p=project(o.z,o.lane),w=(o.type==='bus'?85:o.type==='bike'?32:60)*p.t,hh=(o.type==='bus'?145:o.type==='bike'?75:95)*p.t;rect(p.x-w*.55,p.y-hh*.12,w*1.1,hh*.22,'#111720');rect(p.x-w/2,p.y-hh,w,hh*.84,o.type==='taxi'?'#e7b935':o.type==='bus'?'#d83b3b':o.type==='bike'?'#e94a72':'#b4c1c7');rect(p.x-w*.37,p.y-hh*.82,w*.74,hh*.33,'#17384d');if(o.type==='taxi')rect(p.x-w/2,p.y-hh,w,hh*.14,'#16181c');if(o.type==='bus'){g.fillStyle='white';g.font=Math.max(8,16*p.t)+'px sans-serif';g.textAlign='center';g.fillText('BEST',p.x,p.y-hh*.9)}});let px=W/2+x*W*.27,py=H*.82;g.save();g.translate(px,py);g.rotate(((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))*.12);g.fillStyle='#14171f';g.beginPath();g.ellipse(0,34,23,47,0,0,7);g.fill();poly([[-29,4],[29,4],[20,-58],[-20,-58]],'#e23b4b');g.fillStyle='#19263b';g.beginPath();g.ellipse(0,-59,23,26,0,0,7);g.fill();rect(-9,-39,18,18,'#f4c492');rect(-30,-25,13,49,'#f4c23a');rect(17,-25,13,49,'#f4c23a');if(keys.Space){g.strokeStyle='#e8b38a';g.lineWidth=10;g.beginPath();g.moveTo(20,-22);g.lineTo(60,-45);g.stroke()}g.restore();if(damage>0)rect(0,0,W,H,'#ff303033')}function loop(now){if(!run)return;let dt=Math.min((now-last)/1000,.05);last=now;speed=Math.max(0,Math.min(195,speed+((keys.ArrowUp||keys.KeyW)?95:(keys.ArrowDown||keys.KeyS)?-170:-34)*dt));let steer=Number(!!(keys.ArrowRight||keys.KeyD))-Number(!!(keys.ArrowLeft||keys.KeyA));x=Math.max(-1.15,Math.min(1.15,x+steer*dt*(.9+speed/115)));if(Math.abs(x)>1)speed=Math.max(0,speed-75*dt);dist+=speed/3.6*dt;spawn-=dt;punch=Math.max(0,punch-dt);damage=Math.max(0,damage-dt);if(spawn<=0){spawn=.65+Math.random()*.7;cars.push({z:2700,lane:Math.random()*1.6-.8,type:['taxi','taxi','bus','bike','car'][Math.floor(Math.random()*5)],hit:false})}for(let o of cars){o.z-=speed*dt*3.6;if(!o.hit&&o.z<85&&o.z>0&&Math.abs(o.lane-x)<(o.type==='bus'?.29:.23)){o.hit=true;if(keys.Space&&o.type==='bike'&&punch===0){score+=300;punch=.4}else{hp-=o.type==='bus'?35:20;speed*=.45;damage=.4}}if(o.z<0&&!o.hit){score+=25;o.hit=true}}cars=cars.filter(o=>o.z>-100);if(keys.Space&&punch===0){punch=.45;let rival=cars.find(o=>o.type==='bike'&&!o.hit&&o.z<240&&Math.abs(o.lane-x)<.4);if(rival){rival.hit=true;rival.z=-200;score+=300}}ui('speed').textContent=Math.round(speed);ui('hp').textContent=Math.max(0,hp);ui('dist').textContent=Math.min(3000,Math.round(dist));ui('score').textContent=score;draw();if(hp<=0||dist>=3000){run=false;ui('overlay').style.display='grid';ui('overlay').querySelector('section').innerHTML='<h1>'+(hp<=0?'WIPED OUT':'YOU WIN!')+'</h1><p>Score: '+score+' · Distance: '+Math.round(dist)+' m</p><button onclick="reset()">RACE AGAIN 🏁</button>';return}requestAnimationFrame(loop)}draw();
</script></html>
